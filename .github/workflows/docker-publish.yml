name: Docker Hub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ver="${GITHUB_REF#refs/tags/}"
          else
            ver="v$(tr -d ' \r\n' < version.txt)"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Publishing erriour/databin:latest and erriour/databin:${ver}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: erriour
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            erriour/databin:latest
            erriour/databin:${{ steps.tags.outputs.version }}
