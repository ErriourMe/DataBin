name: Docker Hub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve image tags
        id: tags
        run: |
          normalize() {
            local raw="$1"
            raw="${raw#v}"
            echo "v${raw}"
          }
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ver="$(normalize "${GITHUB_REF#refs/tags/}")"
          else
            ver="$(normalize "$(tr -d ' \r\n' < version.txt)")"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Publishing erriour/databin:latest and erriour/databin:${ver}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: erriour
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            erriour/databin:latest
            erriour/databin:${{ steps.tags.outputs.version }}
